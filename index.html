<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sync</title>
    <meta
      name="description"
      content="Sync is a shared availability page. Mark when you are free, or fill those times from Google Calendar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('sync-theme');
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
